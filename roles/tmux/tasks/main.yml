---
- name: Validate tmux_install_method
  ansible.builtin.fail:
    msg: >-
      Invalid tmux_install_method '{{ tmux_install_method }}'.
      Supported values are 'default' and 'github_release'.
  when: tmux_install_method not in ['default', 'github_release']

- name: Install tmux package
  become: true
  ansible.builtin.package:
    name: tmux
  when: ansible_facts.distribution != 'MacOSX' and tmux_install_method != 'github_release'

- name: Install tmux from official binaries
  ansible.builtin.include_tasks: install_github_release.yml
  when: ansible_facts.distribution != 'MacOSX' and tmux_install_method == 'github_release'

- name: Install tmux package
  ansible.builtin.package:
    name: tmux
  when: ansible_facts.distribution == 'MacOSX'

- name: Install tmux plugin manager
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: ~/.config/tmux/plugins/tpm
    version: master
    update: false

- name: Install catppuccin themes
  ansible.builtin.git:
    # Using my own fork since upstream uses `set -o` which means switching
    # themes isn't possible.
    repo: https://github.com/Javex/catppuccin-tmux.git
    dest: ~/.config/tmux/plugins/catppuccin/tmux
    version: main
    update: false

- name: Set up tmux config
  ansible.builtin.file:
    state: link
    src: "{{ role_path }}/files/tmux.conf"
    dest: ~/.config/tmux/tmux.conf
    force: true

#
# Systemd user autostart unit
#
# continuum ships a default unit, but it's not very good. The unit we ship here
# does a better job of inheriting environment variables from the GUI session.
- name: Manage systemd user autostart
  when:
    - tmux_systemd_autostart
    - ansible_facts.system == 'Linux'
  block:
    - name: Ensure systemd user directory exists
      ansible.builtin.file:
        path: ~/.config/systemd/user
        state: directory
        mode: "0755"

    - name: Deploy systemd user unit
      ansible.builtin.template:
        src: tmux.service.j2
        dest: ~/.config/systemd/user/tmux.service
        mode: "0644"
      register: _tmux_unit

    - name: Reload user systemd manager
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      when: _tmux_unit is changed

    - name: Disable tmux service
      ansible.builtin.systemd:
        name: tmux.service
        scope: user
        enabled: false
      when: _tmux_unit is changed

    - name: Enable tmux service
      ansible.builtin.systemd:
        name: tmux.service
        scope: user
        enabled: true
      when: _tmux_unit is changed

    - name: Print restart notice
      ansible.builtin.debug:
        msg: >-
          Manually restarted via `systemctl --user restart tmux` from outside
          tmux when ready to apply new systemd unit config.
      when: _tmux_unit is changed

    - name: Enable tmux user service
      ansible.builtin.systemd:
        name: tmux.service
        scope: user
        enabled: true
