set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# This branch contains some fixes to speed up the save script
set -g @plugin 'Javex/tmux-resurrect#faster-save'
set -g @plugin 'tmux-plugins/tmux-continuum'


# Session restore
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '1'

# Restore nvim
set -g @resurrect-strategy-nvim 'session'
# Restore contents
set -g @resurrect-capture-pane-contents 'on'
# Restore these programs as well
set -g @resurrect-processes 'btop'

# Switch to another session if exiting the last window in a session. Without
# this tmux will detach.
set-option -g detach-on-destroy off

# Rebind ^B to ^<space>
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Shift Alt vim keys to switch windows
bind-key -n M-H previous-window
bind-key -n M-L next-window

# Ctrl-Shift Left/Right to move windows around
# See https://superuser.com/a/552493/149400
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Support Shift+Enter in Claude Code when running inside tmux
# See https://github.com/anthropics/claude-code/issues/6072
bind-key -T root S-Enter send-keys Escape "[13;2u"

# Enable mouse support
set-option -g mouse on

# Enable passthrough to support, for example, sending notifications via the
# terminal. The option has to be "all" because Claude Code uses it to notify me
# when running in the background.
set-option -g allow-passthrough all

# Set vi-mode
set-window-option -g mode-keys vi
# vi-mode keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Use osc for clipboard
# The terminal handles how to forward this to the clipboard
# https://ghostty.org/docs/vt/osc/52
set -g set-clipboard on
# Configure "y" as the yank key which sends contents to the clipboard using the
# above clipboard configuration.
# Use "copy-selection" instead of "copy-selection-and-cancel" because the
# latter cancels scrolling.
# This can be annoying when trying to copy something but keep reading,
# or when copying the wrong thing and wanting to try again.
bind-key -T copy-mode-vi "y" send-keys -X "copy-selection"


# 256color compat
set-option -g default-terminal screen-256color
set-option -ag terminal-features ",xterm-256color:RGB"

# Enable dark theme for catppuccin
# Note: catppuccin is not loaded as a plugin, it's cloned locally and there's a
# separate `run` command at the bottom
# Have to use if-shell here because a regular %if doesn't seem to work,
# possibly because #{client_theme} isn't set yet?
if-shell -F "#{==:#{client_theme},light}" {
    set -g @catppuccin_flavor 'latte'
} {
    set -g @catppuccin_flavor 'mocha'
}

# These hooks are called when the OS reports a theme change via mode 2031
# Implemented in https://github.com/tmux/tmux/pull/4353
# This does not trigger on initial load so we still need to set it in the
# config as normal.
set-hook -g client-dark-theme {
  set -g @catppuccin_flavor "mocha"
  run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
}
set-hook -g client-light-theme {
  set -g @catppuccin_flavor "latte"
  run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
}

# catppuccin interpolates these variables into its own styles. We just set the
# text, and the plugin sets the colours around it.
set -g @catppuccin_window_status_style 'basic'
# When zoomed in, this displays a nice square symbol
set -g @catppuccin_window_text ' #{window_name} #{?window_zoomed_flag,󰊓 ,}'
set -g @catppuccin_window_current_text ' #{window_name} #{?window_zoomed_flag,󰊓 ,}'

# Inspired by https://github.com/niksingh710/minimal-tmux-status
# Adjusted for catppuccin style
set-option -g status-position "bottom"
set-option -g status-justify "centre"
# This creates the text "tmux" on the left and when the prefix is pressed it
# gets highlighted. The colours are from catppuccin.
set-option -g status-left "#[bg=default,fg=default,bold]#{?client_prefix,,  #S  }#[bg=#{@thm_mauve},fg=#{@thm_crust},bold]#{?client_prefix,  #S  ,}#[bg=default,fg=default,bold]"
set -g status-left-length 30
set-option -g status-right "#S"


# If it starts at one, we can easily use the keyboard numbers 1-9 + 0 in
# sequence
set-option -g base-index 1
set-option -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Title stuff
set-option -g set-titles on
set-option -g set-titles-string '#{pane_title}'

# History lines
set -g history-limit 5000

# This allows to use terminal scrollbars
set -g terminal-overrides 'xterm*:smcup@:rmcup@'


# Split windows in current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Bind Option + Left Arrow to move backward by word
bind-key -n M-Left send-keys M-b
# Bind Option + Right Arrow to move forward by word
bind-key -n M-Right send-keys M-f

#
# Status bar
#
set-option -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#{host_short} %H:%M %d-%b-%y"

# Milliseconds to display the pane numbers
set -g display-panes-time 3000

# Let tmux restore the environment in each pane
# Disabled as it's causing more trouble than it's worth
#set -g @resurrect-hook-pre-restore-pane-processes 'for pane in $(tmux list-panes -s -F "#D"); do tmux send-keys -t "${pane}" "eval $(tmux show-environment -s) clear;"; done'

# Optional machine-specific overrides. This file is not managed by ansible
# (tmux.conf itself is just a symlink), so it can be created by hand on any
# machine that needs different settings than the defaults above, e.g.:
#   set -g @continuum-save-interval '15'
if-shell "test -f ~/.config/tmux/tmux.local.conf" "source-file ~/.config/tmux/tmux.local.conf"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
run '~/.config/tmux/plugins/tpm/tpm'
