---
- name: Validate gitconfig options
  ansible.builtin.include_tasks: validate.yml

- name: Apply gitconfig via include file (default)
  ansible.builtin.include_tasks: include.yml
  when: not (gitconfig_use_per_key | default(false))

- name: Apply gitconfig per key (legacy fallback)
  ansible.builtin.include_tasks: per_key.yml
  when: gitconfig_use_per_key | default(false)
